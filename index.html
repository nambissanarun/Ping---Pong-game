<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>

    <style>
        body {
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        canvas {
            background: black;
            display: block;
            margin: 20px auto;
            border: 2px solid white;
        }

        p {
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h1>Pong Game</h1>
    <p>Move your paddle using W and S keys.</p>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        // Get the canvas and drawing context
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Create the player, enemy, and ball
        const player = {
            x: 20, y: 170, width: 10, height: 60
        };

        const enemy = {
            x: 570, y: 170, width: 10, height: 60
        };

        const ball = {
            x: 300, y: 200, radius: 8
        };

        // Ball movement
        let bx = 5;
        let by = 5;

        // Scores
        let score1 = 0;
        let score2 = 0;

        // Track pressed keys
        const keys = {};

        document.addEventListener("keydown", function(e) {
            keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener("keyup", function(e) {
            keys[e.key.toLowerCase()] = false;
        });

        // Draw a rectangle
        function drawRect(obj) {
            ctx.fillStyle = "white";
            ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
        }

        // Check collision between the ball and a paddle
        function collision(paddle) {
            return (
                ball.x + ball.radius > paddle.x &&
                ball.x - ball.radius < paddle.x + paddle.width &&
                ball.y + ball.radius > paddle.y &&
                ball.y - ball.radius < paddle.y + paddle.height
            );
        }

        // Reset the ball to the center
        function resetBall(direction) {
            ball.x = 300;
            ball.y = 200;
            bx = direction * 5;
            by = 5;
        }

        // Update the game
        function update() {
            // Move the player using W and S
            if (keys["s"]) {
                player.y += 5;
            }

            if (keys["w"]) {
                player.y -= 5;
            }

            // Keep the player inside the screen
            player.y = Math.max(
                0,
                Math.min(340, player.y)
            );

            // Computer-controlled opponent
            if (enemy.y + enemy.height / 2 < ball.y) {
                enemy.y += 4;
            } else {
                enemy.y -= 4;
            }

            // Keep the opponent inside the screen
            enemy.y = Math.max(
                0,
                Math.min(340, enemy.y)
            );

            // Move the ball
            ball.x += bx;
            ball.y += by;

            // Bounce off the top and bottom walls
            if (
                ball.y - ball.radius <= 0 ||
                ball.y + ball.radius >= canvas.height
            ) {
                by *= -1;
            }

            // Bounce off the paddles
            if (
                (collision(player) && bx < 0) ||
                (collision(enemy) && bx > 0)
            ) {
                bx *= -1;
            }

            // Opponent scores if the ball passes the player
            if (ball.x - ball.radius <= 0) {
                score2++;
                resetBall(1);
            }

            // Player scores if the ball passes the opponent
            if (ball.x + ball.radius >= canvas.width) {
                score1++;
                resetBall(-1);
            }
        }

        // Draw everything on the screen
        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw the score
            ctx.fillStyle = "white";
            ctx.font = "24px Arial";
            ctx.fillText(
                `Player: ${score1}  Opponent: ${score2}`,
                200,
                35
            );

            // Draw paddles
            drawRect(player);
            drawRect(enemy);

            // Draw the ball
            ctx.beginPath();
            ctx.arc(
                ball.x,
                ball.y,
                ball.radius,
                0,
                Math.PI * 2
            );
            ctx.fillStyle = "white";
            ctx.fill();
        }

        // Main game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
